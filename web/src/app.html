<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>观复 · 每日数据聚合</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // 首屏前落主题与字号：等 Svelte 挂载再切会白闪/字号跳一下。
      (() => {
        try {
          const t = localStorage.getItem('guanfu.theme') || 'system';
          const dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);

          const s = localStorage.getItem('guanfu.textSize');
          if (s === 'small' || s === 'normal' || s === 'large' || s === 'xlarge') {
            document.documentElement.dataset.textSize = s;
          }
        } catch {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
