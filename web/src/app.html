<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>观复 · 每日数据聚合</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131418" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="观复" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" sizes="180x180" />
    <script>
      // 首屏前落主题与字号：等 Svelte 挂载再切会白闪/字号跳一下。
      (() => {
        try {
          const t = localStorage.getItem('guanfu.theme') || 'system';
          const dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);

          const s = localStorage.getItem('guanfu.textSize');
          if (s === 'small' || s === 'normal' || s === 'large' || s === 'xlarge') {
            document.documentElement.dataset.textSize = s;
          }
        } catch {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
