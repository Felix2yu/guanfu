# Felix2yu 组织统一依赖更新配置 —— 模板来自 Felix2yu/.github/preset/dependabot.yml
#
# 升级时整份覆盖，不要在副本里手改 —— 否则下次同步会打架。
# 设计理由与合并策略见 Felix2yu/.github/docs/dependabot.md

version: 2
updates:
  # ── Go 后端 ─────────────────────────────────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Asia/Shanghai"
    # 默认只有 5，达到上限后会「静默停止」提新 PR 且不报错；10 容纳分组后的峰值
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
    # patch / minor 合成一个 PR（否则每周十几个 PR，没人看得完）；
    # major 单独成组：它要读 changelog，不能混在一堆 patch 里顺手合掉
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      go-major:
        patterns: ["*"]
        update-types: ["major"]

  # ── 前端 npm ────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
    # 与 preset 同步：typescript 的 major 不提 PR。web 的 typescript@~6 是 JS 编译器 API 宿主，
    # @sveltejs/kit 的 svelte-kit sync 与 svelte-check 都 require 它；换成 7 会让 CI 在
    # pnpm install 的 postinstall 就崩（PR#2 的 test/test 正是这么红的）。本仓库还没装
    # @typescript/native 别名，要用 TS7 得先补「~6 宿主 + 别名 + svelte-check --tsgo」这一套，
    # 理由与实测见 Felix2yu/.github/docs/dependabot.md 第六节
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ── Docker 基础镜像 ─────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"

  # ── GitHub Actions ──────────────────────────────────────────────────
  # 注：Felix2yu/.github/.github/workflows/*.yml@v1 这种远程 reusable workflow 引用
  # Dependabot 认不出来，得手动 version bump；这里管的是 ci.yml 里散落的
  # actions/checkout、actions/cache 等第三方 action 的版本。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "ci"
